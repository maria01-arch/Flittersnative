plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.flitterstrim'
version = '0.1.0'

android {
  namespace "expo.modules.flitterstrim"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same Media3 version as expo-video (1.9.0), so the two never clash.
  implementation "androidx.media3:media3-transformer:1.9.0"
  implementation "androidx.media3:media3-common:1.9.0"
}
